# Base de datos PostgreSQL para desarrollo local: `docker compose up -d`
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: novastore
      POSTGRES_PASSWORD: novastore
      POSTGRES_DB: novastore
    ports:
      - "5432:5432"
    volumes:
      - novastore_db:/var/lib/postgresql/data
volumes:
  novastore_db:
